<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Pulse - Modern News Aggregator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">⚡ Global Pulse News</div>
        <div class="nav-controls">
            <input type="text" id="searchInput" placeholder="Search breaking headlines...">
            <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
        </div>
    </header>

    <div class="categories-bar">
        <button class="cat-pill active" onclick="filterCategory('all')">All Top News</button>
        <button class="cat-pill" onclick="filterCategory('technology')">Technology</button>
        <button class="cat-pill" onclick="filterCategory('business')">Business & Finance</button>
        <button class="cat-pill" onclick="filterCategory('science')">AI & Science</button>
        <button class="cat-pill" onclick="filterCategory('health')">Health</button>
        <button class="cat-pill" onclick="filterCategory('sports')">Sports</button>
    </div>

    <main class="container">
        <div id="newsGrid" class="news-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
